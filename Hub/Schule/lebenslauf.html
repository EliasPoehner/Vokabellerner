<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lebenslauf-Generator – F11 HUB</title>
  <!-- Apply saved theme before first paint to avoid flash -->
  <script>
    (function () {
      var m = localStorage.getItem('hub-theme') || 'system';
      var cl = document.documentElement.classList;
      cl.remove('dark', 'light');
      if (m === 'dark') cl.add('dark');
      else if (m === 'light') cl.add('light');
      else cl.add(window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script type="module" src="./lebenslauf.ts"></script>
</head>
<body class="bg-background text-on-surface overflow-hidden" style="height:100vh;">

  <!-- ── Top Bar ─────────────────────────────────────────────────────── -->
  <header class="h-14 flex items-center gap-3 px-4 md:px-6 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md flex-shrink-0 z-50">
    <a href="/"
      class="flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-primary transition-colors flex-shrink-0">
      <span class="material-symbols-outlined" style="font-size:17px">arrow_back</span>
      <span class="hidden sm:inline">F11 HUB</span>
    </a>
    <div class="w-px h-5 bg-slate-700 flex-shrink-0"></div>
    <span class="material-symbols-outlined text-secondary flex-shrink-0" style="font-size:18px">badge</span>
    <h1 class="text-sm font-bold text-on-surface flex-1 truncate">Lebenslauf-Generator</h1>

    <span id="saved-badge"
      style="opacity:0;transition:opacity .3s;"
      class="text-xs text-secondary font-semibold flex-shrink-0 flex items-center gap-1">
      <span class="material-symbols-outlined" style="font-size:13px">check_circle</span>
      Gespeichert
    </span>

    <!-- Accent color swatch + hidden picker -->
    <div class="relative flex-shrink-0" title="Akzentfarbe ändern">
      <div id="accent-swatch"
        class="w-6 h-6 rounded-full border-2 border-slate-600 hover:border-primary transition-colors cursor-pointer"
        style="background:#ddb7ff;"></div>
      <input type="color" id="accent-picker" value="#ddb7ff"
        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer rounded-full" />
    </div>

    <button id="btn-pdf"
      class="flex items-center gap-1.5 px-3 py-1.5 bg-primary/10 text-primary border border-primary/20 rounded-lg text-xs font-semibold hover:bg-primary/20 transition-colors flex-shrink-0 disabled:opacity-40 disabled:cursor-not-allowed">
      <span class="material-symbols-outlined" style="font-size:14px">picture_as_pdf</span>
      PDF
    </button>
    <button id="btn-word"
      class="flex items-center gap-1.5 px-3 py-1.5 bg-secondary/20 text-secondary border border-secondary/30 rounded-lg text-xs font-semibold hover:bg-secondary/30 transition-colors flex-shrink-0 disabled:opacity-40 disabled:cursor-not-allowed">
      <span class="material-symbols-outlined" style="font-size:14px">article</span>
      Word
    </button>
  </header>

  <!-- ── Mobile Tabs ────────────────────────────────────────────────── -->
  <div class="md:hidden flex flex-shrink-0 border-b border-slate-800 bg-slate-900">
    <button id="tab-form"
      class="flex-1 py-2.5 text-xs font-semibold text-primary border-b-2 border-primary transition-colors">
      Bearbeiten
    </button>
    <button id="tab-preview"
      class="flex-1 py-2.5 text-xs font-semibold text-slate-500 border-b-2 border-transparent transition-colors">
      Vorschau
    </button>
  </div>

  <!-- ── Split Layout ───────────────────────────────────────────────── -->
  <div id="lv-split" class="flex overflow-hidden">

    <!-- Form Panel -->
    <div id="panel-form"
      class="w-full md:w-[45%] flex-shrink-0 border-r border-slate-800 space-y-3 p-4 pb-8 @container"
      style="height:calc(100vh - 56px); overflow-y:auto; box-sizing:border-box;">
      <!-- Rendered by lebenslauf.ts -->
    </div>

    <!-- Preview Panel -->
    <div id="panel-preview"
      class="lv-preview-bg hidden md:flex flex-1 overflow-y-auto items-start justify-center p-6 lg:p-10"
      style="height:calc(100vh - 56px);">
      <div id="cv-preview"
        style="width:100%;max-width:794px;min-height:1123px;background:#fff;color:#111827;padding:56px 64px;flex-shrink:0;box-shadow:0 20px 60px rgba(0,0,0,.6);font-family:'Inter',system-ui,sans-serif;">
        <!-- Rendered by lebenslauf.ts -->
      </div>
    </div>

  </div>

</body>
</html>
